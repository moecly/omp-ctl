name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: "--bundles deb,rpm"
          - platform: windows-latest
            args: "--bundles nsis,msi"
          - platform: macos-latest
            args: "--bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: cd web && bun install

      - name: Build frontend
        run: cd web && bun run build

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "omp-ctl ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # 不能拆成独立 workflow：release 事件由 GITHUB_TOKEN 创建，GitHub 不会用它触发新 workflow。
  aur:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      # 一个包失败不影响另一个：omp-ctl-bin 的资产和 omp-ctl 的源码构建互不相关
      fail-fast: false
      matrix:
        package: [omp-ctl, omp-ctl-bin]
    container:
      image: archlinux:base-devel
      options: --user root
    steps:
      # base-devel 镜像里没有 git/openssh，必须先装（checkout 也要用 git）
      - name: 安装容器内依赖
        run: pacman -Sy --noconfirm --needed git openssh

      - uses: actions/checkout@v4

      - name: 准备 makepkg 环境与 AUR 密钥
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          # makepkg 拒绝以 root 运行，连 --printsrcinfo 也不例外
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          install -d -o builder -g builder -m700 /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_KEY" >/home/builder/.ssh/aur
          chown builder:builder /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur

      - name: 校验 AUR 密钥与认证
        run: |
          set -euo pipefail
          key=/home/builder/.ssh/aur
          [ -s "$key" ] || { echo "::error::secret AUR_SSH_KEY 为空或未设置"; exit 1; }
          pub=$(ssh-keygen -y -f "$key" -P '') || {
              echo "::error::AUR_SSH_KEY 不是有效私钥（公钥 / 带口令 / 被截断）"; exit 1; }
          echo "CI 公钥指纹：$(printf '%s\n' "$pub" | ssh-keygen -lf -)"
          out=$(sudo -u builder -H ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
                -o StrictHostKeyChecking=accept-new -T aur@aur.archlinux.org 2>&1 || true)
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -q 'Permission denied'; then
              echo "::error::AUR 拒绝了该密钥：账户未注册，或 My Account 中登记的公钥与上面指纹不一致"
              exit 1
          fi

      - name: 推送 PKGBUILD 到 AUR
        run: |
          set -euo pipefail
          sudo -u builder -H env \
            AUR_KEY_FILE=/home/builder/.ssh/aur \
            GIT_SSH_COMMAND='ssh -i /home/builder/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new' \
            bash "$GITHUB_WORKSPACE/packaging/aur/publish.sh" "${GITHUB_REF_NAME}" 1 "${{ matrix.package }}"
