name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: "--bundles deb,rpm"
          - platform: windows-latest
            args: "--bundles nsis,msi"
          - platform: macos-latest
            args: "--bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: cd web && bun install

      - name: Build frontend
        run: cd web && bun run build

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "omp-ctl ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # 不能拆成独立 workflow：release 事件由 GITHUB_TOKEN 创建，GitHub 不会用它触发新 workflow。
  aur:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --user root
    steps:
      # base-devel 镜像里没有 git/openssh，必须先装（checkout 也要用 git）
      - name: 安装容器内依赖
        run: pacman -Sy --noconfirm --needed git openssh

      - uses: actions/checkout@v4

      - name: 准备 makepkg 环境与 AUR 密钥
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          # makepkg 拒绝以 root 运行，连 --printsrcinfo 也不例外
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          install -d -o builder -g builder -m700 /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_KEY" >/home/builder/.ssh/aur
          chown builder:builder /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur

      - name: 推送 PKGBUILD 到 AUR
        run: |
          set -euo pipefail
          sudo -u builder -H env \
            AUR_KEY_FILE=/home/builder/.ssh/aur \
            GIT_SSH_COMMAND='ssh -i /home/builder/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new' \
            bash "$GITHUB_WORKSPACE/packaging/aur/publish.sh" "${GITHUB_REF_NAME}"
