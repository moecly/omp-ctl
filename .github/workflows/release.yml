name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "仅重发 AUR：填要发布的 tag（如 v0.8.4）。留空则按所选 ref 重跑构建，ref 必须是 tag。"
        required: false
        type: string

jobs:
  release:
    # 必须绑死在 v* tag 上：tauri-action 用 github.ref_name 当 tagName，在分支上
    # 运行会把分支名（如 main）建成 tag 和 release，还会抢走 Latest。
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: "--bundles deb,rpm"
          - platform: windows-latest
            args: "--bundles nsis,msi"
          - platform: macos-latest
            args: "--bundles app,dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: cd web && bun install

      - name: Build frontend
        run: cd web && bun run build

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "omp-ctl ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # 不能拆成独立 workflow：release 事件由 GITHUB_TOKEN 创建，GitHub 不会用它触发新 workflow。
  aur:
    needs: [release]
    # 两种入口：tag push 且构建成功；或手动触发并显式填了 tag。
    # needs 会连带跳过，所以必须用 always() 才能单独重发 AUR。
    # 手动入口只填了 tag 时 release 会因 ref 不是 tag 而跳过，故这里不看它的结果。
    if: |
      always() && (
        (startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    runs-on: ubuntu-latest
    strategy:
      # 一个包失败不影响另一个：omp-ctl-bin 的资产和 omp-ctl 的源码构建互不相关
      fail-fast: false
      matrix:
        package: [omp-ctl, omp-ctl-bin]
    container:
      image: archlinux:base-devel
      options: --user root
    steps:
      # 必须用 -Syu 而不是 -Sy：`-Sy` 是部分升级，镜像里的 openssl 4.x 会与
      # 基础镜像中依赖 libcrypto.so=3-64 的 curl/pacman/sudo 冲突，导致事务无法解析。
      - name: 安装容器内依赖
        run: pacman -Syu --noconfirm --needed git openssh

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: 准备 makepkg 环境与 AUR 密钥
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          # makepkg 拒绝以 root 运行，连 --printsrcinfo 也不例外
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          install -d -o builder -g builder -m700 /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_KEY" >/home/builder/.ssh/aur
          chown builder:builder /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur

      - name: 校验 AUR 密钥与认证
        run: |
          set -euo pipefail
          key=/home/builder/.ssh/aur
          [ -s "$key" ] || { echo "::error::secret AUR_SSH_KEY 为空或未设置"; exit 1; }
          pub=$(ssh-keygen -y -f "$key" -P '') || {
              echo "::error::AUR_SSH_KEY 不是有效私钥（公钥 / 带口令 / 被截断）"; exit 1; }
          echo "CI 公钥指纹：$(printf '%s\n' "$pub" | ssh-keygen -lf -)"
          out=$(sudo -u builder -H ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
                -o StrictHostKeyChecking=accept-new -T aur@aur.archlinux.org 2>&1 || true)
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -q 'Permission denied'; then
              echo "::error::AUR 拒绝了该密钥：账户未注册，或 My Account 中登记的公钥与上面指纹不一致"
              exit 1
          fi

      - name: 推送 PKGBUILD 到 AUR
        run: |
          set -euo pipefail
          sudo -u builder -H env \
            AUR_KEY_FILE=/home/builder/.ssh/aur \
            GIT_SSH_COMMAND='ssh -i /home/builder/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new' \
            bash "$GITHUB_WORKSPACE/packaging/aur/publish.sh" "${{ inputs.tag || github.ref_name }}" 1 "${{ matrix.package }}"
