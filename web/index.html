<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>omp-ctl</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /*
       * First-paint appearance: sets the tone and palette data attributes so the
       * static `palettes.css` blocks apply before React mounts. Without this the
       * window would paint one palette and then switch, which is the flash the
       * palette system is meant to avoid.
       */
      (function () {
        try {
          var root = document.documentElement;
          var pref = localStorage.getItem("omp-ctl.theme");
          var light = window.matchMedia("(prefers-color-scheme: light)").matches;
          var dark = pref === "dark" || (pref === "auto" && !light) ? true : pref === "light" ? false : !light;
          root.dataset.tone = dark ? "dark" : "light";
          root.dataset.theme = dark ? "dark" : "light";
          root.dataset.palette = localStorage.getItem("omp-ctl.palette") || "indigo";
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
