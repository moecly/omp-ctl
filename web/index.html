<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>omp-ctl</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var p = localStorage.getItem("omp-ctl.theme");
          var light = window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.dataset.theme = p === "light" || (p === "auto" && light) ? "light" : "dark";
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
